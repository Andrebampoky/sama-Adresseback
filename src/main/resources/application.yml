server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: samaadresse-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/samaadresse}
    username: ${SPRING_DATASOURCE_USERNAME:samaadresse_dev}
    password: ${SPRING_DATASOURCE_PASSWORD:change-me-local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      # Photo de façade : 5 Mo par fichier (vérifié aussi par le serveur avant enregistrement).
      max-file-size: 5MB
      max-request-size: 6MB
  mvc:
    # Erreurs au format application/problem+json (RFC 9457).
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  # Le cahier des charges demande OpenAPI 3.0.
  api-docs:
    version: openapi_3_0
  swagger-ui:
    path: /swagger-ui.html

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  security:
    jwt:
      # Clé HMAC en Base64 (>= 32 octets). Vide : clé éphémère générée au démarrage (développement seulement).
      secret: ${APP_JWT_SECRET:}
      require-secret: ${APP_JWT_REQUIRE_SECRET:false}
      validity: ${APP_JWT_VALIDITY:PT1H}
    login:
      max-failures: 5
      lock-duration: PT15M
    # E-mail d'un compte déjà inscrit à promouvoir ADMIN au démarrage. Vide : aucune promotion.
    bootstrap-admin-email: ${APP_BOOTSTRAP_ADMIN_EMAIL:}
  # URL publique du frontend : sert à construire les liens envoyés par SMS.
  public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:5173}
  sms:
    # twilio | simulation | vide (désactivé). « simulation » n'envoie rien.
    provider: ${APP_SMS_PROVIDER:}
    twilio:
      account-sid: ${TWILIO_ACCOUNT_SID:}
      auth-token: ${TWILIO_AUTH_TOKEN:}
      from: ${TWILIO_FROM:}
  routing:
    ors:
      # Clé OpenRouteService (gratuite sur openrouteservice.org). Vide : itinéraire désactivé (503).
      api-key: ${ORS_API_KEY:}
    # Sans clé ORS : repli sur un serveur OSRM public gratuit (données OpenStreetMap, sans clé).
    fallback:
      enabled: ${APP_ROUTING_FALLBACK_ENABLED:true}
      osrm-base-url: ${APP_ROUTING_OSRM_BASE_URL:https://routing.openstreetmap.de}
  photos:
    # Stockage local (développement). En production : volume persistant ou stockage objet.
    directory: ${APP_PHOTOS_DIRECTORY:./data/photos}
  address:
    # Zone de service approximative (Sénégal) ; les coordonnées hors zone sont refusées.
    bounds:
      min-latitude: 12.0
      max-latitude: 16.8
      min-longitude: -17.6
      max-longitude: -11.3
