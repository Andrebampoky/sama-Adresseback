spring:
  datasource:
    url: jdbc:h2:mem:samaadresse;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  # Les tests n'appellent jamais de service Internet réel.
  routing:
    fallback:
      enabled: false
  photos:
    directory: ${java.io.tmpdir}/samaadresse-test-photos
  cors:
    allowed-origins: http://localhost:5173
