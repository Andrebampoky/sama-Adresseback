services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-samaadresse}
      POSTGRES_USER: ${POSTGRES_USER:-samaadresse_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
    ports:
      - "5432:5432"
    volumes:
      - samaadresse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-samaadresse}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-samaadresse_dev}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Vide par défaut : clé de signature éphémère (sessions perdues au redémarrage du conteneur).
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_BOOTSTRAP_ADMIN_EMAIL: ${APP_BOOTSTRAP_ADMIN_EMAIL:-}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://localhost:5173}
      APP_SMS_PROVIDER: ${APP_SMS_PROVIDER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      ORS_API_KEY: ${ORS_API_KEY:-}
    volumes:
      # Photos de façade conservées entre deux redémarrages du conteneur.
      - samaadresse-photos:/data/photos
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  samaadresse-postgres-data:
  samaadresse-photos:
